[env:esp32s3]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200

; Habilita Serial via USB-CDC (necessário no ESP32-S3)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
